<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATCH DAY FC TOKYO — 観戦日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1450; --bg2:#0B1656; --surface:#0F1E60; --surface2:#18297A;
    --line:#293D94; --line2:#3A50B4;
    --blue:#2B5CE6; --blue-soft:#5E8CFF; --navy:#0A1968;
    --red:#E5202E; --red-soft:#FF4A56;
    --gold:#E8B84B; --draw:#8A93C0;
    --text:#EDF0FB; --muted:#9AA6D8; --muted2:#6B77B0;
    --radius:14px; --radius-sm:9px;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(43,92,230,.10), transparent 60%),
      radial-gradient(1000px 500px at -10% 10%, rgba(229,32,46,.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP',system-ui,sans-serif;
    line-height:1.6; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--blue);color:#fff}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px;border-radius:4px}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, rgba(27,44,150,.97), rgba(17,30,110,.90));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-inner{
    max-width:1080px;margin:0 auto;padding:16px 20px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .crest{
    width:38px;height:38px;border-radius:9px;flex:none;border:none;padding:0;cursor:pointer;
    background:linear-gradient(135deg,var(--blue) 0 50%, var(--red) 50% 100%);
    position:relative;box-shadow:0 4px 14px rgba(43,92,230,.35);overflow:hidden;
  }
  .crest::after{content:"";position:absolute;inset:5px;border:2px solid rgba(255,255,255,.85);border-radius:5px}
  .crest img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
  .crest.has-logo{background:#fff}
  .crest.has-logo::after{display:none}
  .brand h1{
    font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.06em;
    font-size:1.25rem;line-height:1;text-transform:uppercase;
  }
  .brand h1 span{color:var(--muted);font-weight:500}
  .brand small{display:block;font-size:.62rem;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-top:3px}

  .season-pick{
    display:flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:99px;padding:6px 8px 6px 14px;
  }
  .season-pick label{font-size:.66rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .season-pick select{
    background:transparent;border:none;color:var(--text);font-weight:700;
    font-family:'Oswald';font-size:.92rem;padding:2px 4px;
  }
  .season-pick select option{background:var(--surface);color:var(--text)}

  /* ---------- Streak / hero stat ---------- */
  .heroband{max-width:1080px;margin:0 auto;padding:22px 20px 4px}
  .record-line{
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  }
  .record-line .wdl{
    font-family:'Oswald';font-weight:700;font-size:2.9rem;line-height:.9;letter-spacing:.01em;
    display:flex;align-items:baseline;gap:2px;
  }
  .record-line .wdl b{font-weight:700}
  .record-line .wdl .w{color:var(--blue-soft)}
  .record-line .wdl .d{color:var(--draw)}
  .record-line .wdl .l{color:var(--red-soft)}
  .record-line .wdl i{font-style:normal;color:var(--muted2);font-size:1.4rem;padding:0 2px}
  .record-meta{color:var(--muted);font-size:.9rem}
  .record-meta strong{color:var(--text);font-family:'Oswald';font-size:1.1rem;font-weight:600}
  .winrate-chip{
    margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;
  }
  .winrate-chip .big{font-family:'Oswald';font-weight:700;font-size:2rem;color:var(--blue-soft);line-height:1}
  .winrate-chip .lbl{font-size:.6rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .quip{color:var(--muted);font-size:.82rem;margin-top:8px;min-height:1.2em}
  .quip b{color:var(--red-soft);font-weight:700}

  /* ---------- Tabs ---------- */
  /* ---------- Featured match ---------- */
  .featured-wrap{max-width:1080px;margin:16px auto 0;padding:0 20px}
  .featured{
    width:100%;border:1px solid #E5E8F0;border-radius:var(--radius);
    background:#fff;cursor:pointer;overflow:hidden;color:#16213E;
    position:relative;transition:transform .15s ease,box-shadow .15s ease;
    padding:18px 16px 16px;font-family:inherit;
    box-shadow:0 6px 20px rgba(5,10,40,.35);
  }
  .featured:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(5,10,40,.45)}
  .ft-top{text-align:center;margin-bottom:14px}
  .ft-date2{font-weight:700;font-size:1.05rem;color:#16213E;letter-spacing:.02em}
  .ft-venue{font-size:.66rem;letter-spacing:.14em;color:#9198AC;font-weight:600;margin-top:3px}
  .ft-board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .ft-side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
  .ft-badge{width:58px;height:58px;display:flex;align-items:center;justify-content:center;flex:none}
  .ft-badge img{width:100%;height:100%;object-fit:contain}
  .ft-noimg{
    width:52px;height:52px;border-radius:10px;background:#F0F2F8;border:1px solid #E0E3EC;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:#9198AC;
  }
  .ft-name{font-size:.92rem;font-weight:600;color:#3A4560;text-align:center;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ft-mid{display:flex;align-items:center;justify-content:center;gap:14px;white-space:nowrap;padding:0 4px}
  .ft-num{font-weight:700;font-size:2.6rem;line-height:1;color:#16213E}
  .ft-num.win{color:var(--blue)}
  .ft-num.loss{color:var(--red)}
  .ft-dash{font-weight:700;font-size:1.5rem;color:#3A4560;line-height:1}
  .ft-foot{display:flex;justify-content:center;margin-top:16px}
  .ft-btn{
    display:inline-block;background:#EEF1F6;border-radius:99px;
    padding:9px 30px;font-size:.86rem;font-weight:700;color:#3A4560;
  }
  .featured:hover .ft-btn{background:var(--navy);color:#fff}
  .match.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,100%{box-shadow:0 8px 28px rgba(0,0,0,.45)}30%,60%{box-shadow:0 0 0 3px var(--blue-soft)}}

  .tabs{max-width:1080px;margin:18px auto 0;padding:0 20px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
  .tab{
    background:none;border:none;color:var(--muted);font-weight:700;font-size:.9rem;
    padding:12px 16px;position:relative;letter-spacing:.02em;
  }
  .tab[aria-selected="true"]{color:var(--text)}
  .tab[aria-selected="true"]::after{
    content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,var(--blue),var(--red));
  }
  .tab:hover{color:var(--text)}

  main{max-width:1080px;margin:0 auto;padding:24px 20px 120px}

  /* ---------- Records ---------- */
  .empty{
    text-align:center;padding:64px 20px;border:1px dashed #C8CEDC;border-radius:var(--radius);
    color:#6B7488;background:#fff;box-shadow:0 6px 20px rgba(5,10,40,.18);
  }
  .empty h3{font-family:'Oswald';font-weight:600;color:#16213E;font-size:1.3rem;margin-bottom:6px;letter-spacing:.02em}
  .empty p{font-size:.9rem}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .match{
    position:relative;background:#fff;color:#16213E;
    border:1px solid #E5E8F0;border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease;
    box-shadow:0 6px 20px rgba(5,10,40,.28);
  }
  .match:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(5,10,40,.36)}
  .match .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
  .match.win .bar{background:var(--blue);box-shadow:0 0 18px rgba(43,92,230,.6)}
  .match.loss .bar{background:var(--red);box-shadow:0 0 18px rgba(229,32,46,.55)}
  .match.draw .bar{background:var(--draw)}
  .match .body{padding:16px 16px 14px 20px}
  .m-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .m-date{font-size:.72rem;letter-spacing:.12em;color:#9198AC;text-transform:uppercase;font-weight:500}
  .venue-badge{
    font-size:.62rem;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:99px;text-transform:uppercase;
  }
  .venue-badge.home{background:rgba(43,92,230,.1);color:var(--navy);border:1px solid rgba(43,92,230,.3)}
  .venue-badge.kokuritsu{background:rgba(232,184,75,.16);color:#8A6D1E;border:1px solid rgba(232,184,75,.4)}
  .venue-badge.away{background:#EEF1F6;color:#5A6478;border:1px solid #DCE1EC}
  .venue-badge.neutral{background:rgba(232,184,75,.16);color:#8A6D1E;border:1px solid rgba(232,184,75,.4)}

  .scoreboard{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:10px 0 12px;
  }
  .sb-team{font-weight:700;font-size:.98rem;line-height:1.25;color:#1B2340}
  .sb-team.opp{text-align:right;color:#1B2340;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .sb-team.opp .team-crest{margin-top:2px}
  .sb-team .tag{display:block;font-size:.6rem;letter-spacing:.2em;color:#9198AC;text-transform:uppercase;margin-bottom:2px;font-weight:500}
  .sb-score{
    font-family:'Oswald';font-weight:700;font-size:2.5rem;line-height:1;letter-spacing:.02em;color:#14213E;
    background:#F6F7FB;border:1px solid #E5E8F0;border-radius:10px;padding:6px 14px;
    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .sb-score .dash{color:#B7BECB;font-size:1.6rem}
  .match.win .sb-score .me{color:var(--blue)}
  .match.loss .sb-score .me{color:var(--red)}

  .m-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:#6B7488;margin-top:4px}
  .m-meta span{display:inline-flex;align-items:center;gap:4px}
  .stars{color:var(--gold);letter-spacing:2px;font-size:.85rem}
  .stars .off{color:#E2E5EE}
  .mom{
    margin-top:10px;font-size:.78rem;color:#1B2340;
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(232,184,75,.14);border:1px solid rgba(232,184,75,.4);
    padding:5px 10px;border-radius:8px;
  }
  .mom b{color:#8A6D1E;font-weight:700;letter-spacing:.06em;font-size:.66rem}
  .m-note{margin-top:11px;font-size:.85rem;color:#3A4560;white-space:pre-wrap;word-break:break-word}
  .thumbs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid #E5E8F0;cursor:pointer;transition:transform .1s}
  .thumbs img:hover{transform:scale(1.05)}
  .m-actions{display:flex;gap:8px;padding:12px 16px 12px 20px;margin-top:auto;background:var(--navy)}
  .m-actions button{
    flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;
    padding:7px;font-size:.76rem;font-weight:500;color:#fff;transition:.12s;
  }
  .m-actions button:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3)}
  .m-actions .del:hover{color:#FF8C93}
  .m-actions .squad-btn:hover{color:#8FB0FF}

  .squad-box{margin:0 16px 12px 20px;border-top:1px solid #EAECF3;padding-top:8px}
  .squad-toggle{background:none;border:none;color:#6B7488;font-size:.76rem;font-weight:600;letter-spacing:.04em;padding:5px 0;display:flex;align-items:center;gap:7px;width:100%}
  #editSquadFromRate{color:var(--blue-soft)}
  #editSquadFromRate:hover{color:var(--text)}
  .squad-toggle:hover{color:#16213E}
  .squad-toggle .chev{transition:transform .15s;font-size:.62rem;color:var(--blue)}
  .squad-toggle.open .chev{transform:rotate(90deg)}
  .squad-detail{display:none;padding:8px 0 4px}
  .squad-detail.open{display:block}
  .squad-side{margin-bottom:12px}
  .squad-side .side-name{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:7px;color:var(--navy)}
  .squad-side.opp .side-name{color:#8A93AB}
  .squad-group{margin-bottom:7px}
  .squad-group .gl{font-size:.58rem;color:#9198AC;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:.72rem;background:#F0F2F8;border:1px solid #E0E3EC;border-radius:6px;padding:2px 8px;color:#3A4560}
  .chip.bn{background:transparent;color:#8A93AB}
  .sq-hint{font-size:.82rem;color:#3A4560;background:#EDF1FC;border:1px solid #D5DEF5;border-radius:8px;padding:11px 13px;margin-bottom:16px;line-height:1.6}
  .sq-hint b{color:#16213E}
  .crest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
  .crest-tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:4px}
  .crest-tile .sq{width:52px;height:52px;border-radius:10px;background:#F0F2F8;border:1px solid #E0E3EC;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .crest-tile .sq img{width:100%;height:100%;object-fit:contain}
  .crest-tile .sq .plus{color:#9198AC;font-size:1.3rem}
  .crest-tile span.nm{font-size:.68rem;color:var(--muted);text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team-crest{width:22px;height:22px;border-radius:5px;object-fit:contain;background:#fff;flex:none;vertical-align:middle}
  .sq-hint b{color:var(--text)}
  .sq-modal textarea{min-height:92px;font-size:.86rem;line-height:1.7}

  /* ---------- 選手採点 ---------- */
  .rate-hint{font-size:.82rem;color:#3A4560;background:#EDF1FC;border:1px solid #D5DEF5;border-radius:8px;padding:11px 13px;margin-bottom:14px;line-height:1.6}
  .rate-hint b{color:#16213E}
  .rate-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .rate-row:first-child{border-top:none}
  .rate-name{flex:1 1 100%;font-size:.86rem;font-weight:600;color:var(--text)}
  .rate-score{flex:0 0 62px;text-align:center;font-family:'Oswald';font-weight:700;font-size:1rem;background:#fff;border:1px solid #D8DCE8;border-radius:8px;padding:8px 4px;color:#16213E}
  .rate-note{flex:1;min-width:0;background:#fff;border:1px solid #D8DCE8;border-radius:8px;padding:8px 10px;color:#16213E;font-size:.84rem}
  .rate-word{flex:0 0 auto;font-size:.76rem;font-weight:700;color:var(--gold);min-width:56px}
  .rate-score:focus,.rate-note:focus{border-color:var(--blue);background:#fff;outline:none}
  .rt-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid #EAECF3}
  .rt-row:first-child{border-top:none}
  .rt-name{flex:1;font-size:.82rem;color:#3A4560;font-weight:500}
  .rt-score{flex:0 0 auto;font-family:'Oswald';font-weight:700;font-size:1.02rem;min-width:40px;text-align:center;padding:1px 8px;border-radius:6px}
  .rt-score.hi{color:#7A5B0E;background:var(--gold)}
  .rt-score.mid{color:#16213E;background:#EEF1F6}
  .rt-score.lo{color:#fff;background:rgba(229,32,46,.85)}
  .rt-score.none{color:#9198AC;background:transparent;border:1px solid #E0E3EC}
  .rt-note{flex:0 0 100%;font-size:.78rem;color:#6B7488;padding-left:2px}

  /* ---------- フォーメーションピッチ ---------- */
  .pitch-wrap{padding-top:4px}
  .pitch{
    position:relative;width:100%;aspect-ratio:10/11;max-width:420px;margin:0 auto;
    background:
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/25% 100%,
      linear-gradient(180deg,#1E7A3E,#176331);
    border:2px solid rgba(255,255,255,.35);border-radius:10px;overflow:hidden;
  }
  .pitch .line{position:absolute;border:1.5px solid rgba(255,255,255,.4)}
  .pitch .box-top{top:0;left:22%;width:56%;height:15%;border-top:none}
  .pitch .box-bot{bottom:0;left:22%;width:56%;height:15%;border-bottom:none}
  .pitch .centerline{top:50%;left:0;width:100%;height:0;border-bottom:1.5px solid rgba(255,255,255,.4);border-top:none;border-left:none;border-right:none}
  .pitch .circle{top:50%;left:50%;width:16%;padding-top:16%;height:0;border-radius:50%;transform:translate(-50%,-50%)}
  .player{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:64px}
  .pname{font-size:.62rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
  .pscore{font-family:'Oswald';font-weight:700;font-size:.78rem;line-height:1;padding:3px 8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .pscore.ps-hi{background:var(--gold);color:#1B2340}
  .pscore.ps-good{background:#2F7BF6;color:#fff}
  .pscore.ps-mid{background:#EDEFF6;color:#16213E}
  .pscore.ps-lo{background:var(--red);color:#fff}
  .pscore.ps-none{background:rgba(255,255,255,.18);color:#fff}
  .pword{font-size:.56rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);letter-spacing:.02em;white-space:nowrap;margin-top:1px;font-weight:600}
  .subs{margin-top:14px;border-top:1px solid #EAECF3;padding-top:10px}
  .subs-t{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#9198AC;font-weight:700;margin-bottom:8px}
  .sub-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:6px 0;font-size:.85rem;border-top:1px solid #EAECF3}
  .sub-row:first-child{border-top:none}
  .sname{flex:1;font-weight:600;color:#1B2340}
  .sscore{font-family:'Oswald';font-weight:700;font-size:.9rem;min-width:38px;text-align:center;padding:2px 7px;border-radius:6px}
  .sscore.ps-hi{background:var(--gold);color:#1B2340}
  .sscore.ps-good{background:#2F7BF6;color:#fff}
  .sscore.ps-mid{background:#EEF1F6;color:#16213E}
  .sscore.ps-lo{background:var(--red);color:#fff}
  .sscore.ps-none{background:transparent;border:1px solid #E0E3EC;color:#9198AC}
  .sinfo{flex:0 0 auto;font-size:.74rem;color:#6B7488}
  .sword{flex:0 0 auto;font-size:.72rem;color:#6B7488;font-weight:600}
  .sub-time{flex:0 0 100%;font-size:.74rem;color:var(--navy);padding-left:2px}
  .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;margin-top:14px;padding-top:10px;border-top:1px solid #EAECF3}
  .legend div{font-size:.72rem;color:#6B7488;display:flex;gap:6px}
  .legend b{color:#16213E;font-family:'Oswald';font-weight:700;width:30px;flex:none}

  /* ---------- Stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .stat{background:#fff;border:1px solid #E5E8F0;border-radius:var(--radius);padding:18px;box-shadow:0 6px 20px rgba(5,10,40,.22)}
  .stat .lbl{font-size:.66rem;letter-spacing:.18em;color:#9198AC;text-transform:uppercase;margin-bottom:10px}
  .stat .val{font-family:'Oswald';font-weight:700;font-size:2.3rem;line-height:1;color:#16213E}
  .stat .val.blue{color:var(--blue)} .stat .val.red{color:var(--red)}
  .stat .sub{font-size:.78rem;color:#6B7488;margin-top:6px}
  .split{display:flex;gap:18px;margin-top:8px}
  .split div{flex:1}

<script>
/* ============ FC東京 日程マスタ（GAS + Googleスプレッドシート連携） ============
   ここにデプロイしたGASウェブアプリのURLを入れてください。
   例: "https://script.google.com/macros/s/AKfycb.../exec" */
const SCHEDULE_API_URL = "https://script.google.com/macros/s/AKfycbzJcApIJfUjrgzDo8UbOo8O1XGVpstfuRyfcj04xsnLmh7UL83hf_B_qeLneDNcE1s/exec";
const SCHEDULE_CACHE_KEY = "matchday_tokyo_schedule_cache_v2";

let SCHEDULE = {};   // { "2026-27": [ {date, opp, venue}, ... ] }
let SEASONS = [];

function normalizeDate(v){
  if(v==null) return "";
  const s = String(v).trim();
  if(!s) return "";
  // すでに YYYY-MM-DD ならそのまま
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return s;
  // ISO形式(2026-08-08T07:00:00.000Z)などは日本時間に直して日付部分を取り出す
  const d = new Date(s);
  if(isNaN(d)) return s;
  const jst = new Date(d.getTime() + 9*60*60*1000);
  const y = jst.getUTCFullYear();
  const mo = String(jst.getUTCMonth()+1).padStart(2,"0");
  const da = String(jst.getUTCDate()).padStart(2,"0");
  return `${y}-${mo}-${da}`;
}
function scheduleFromRows(rows){
  const byS = {};
  rows.forEach(r=>{
    const season = String(r.season||"").trim();
    if(!season) return;
    if(!byS[season]) byS[season] = [];
    byS[season].push({
      date: normalizeDate(r.date),
      opp: String(r.opp||"").trim(),
      venue: String(r.venue||"").trim()
    });
  });
  Object.values(byS).forEach(list=> list.sort((a,b)=> String(a.date).localeCompare(String(b.date))));
  return byS;
}
function loadScheduleCache(){
  try{
    const raw = localStorage.getItem(SCHEDULE_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveScheduleCache(data){
  try{ localStorage.setItem(SCHEDULE_CACHE_KEY, JSON.stringify(data)); }catch(e){}
}
async function fetchSchedule(){
  if(!SCHEDULE_API_URL){
    toast("日程APIのURLが未設定です");
    return;
  }
  try{
    const res = await fetch(SCHEDULE_API_URL);
    if(!res.ok) throw new Error("network");
    const rows = await res.json();
    SCHEDULE = scheduleFromRows(rows);
    saveScheduleCache(SCHEDULE);
  }catch(err){
    const cached = loadScheduleCache();
    if(cached){ SCHEDULE = cached; toast("日程を取得できず、前回のデータを表示しています"); }
    else { toast("日程を取得できませんでした"); }
  }
  SEASONS = Object.keys(SCHEDULE);
  if(!SEASONS.length) SEASONS = ["2026-27"];
  if(!SCHEDULE[currentSeason || SEASONS[0]]) currentSeason = SEASONS[0];
}

/* ============ 状態管理 ============ */
const STORE_KEY = "matchday_tokyo_v1";
let memoryFallback = null;   // localStorageが使えない環境用
let store = load();
let currentSeason = "";
let editingId = null;
let draftImages = [];
let draftVenue = "home";
let draftWatch = "live";
let draftStars = 0;
let draftSource = "schedule";

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : { records: [] };
  }catch(e){
    return memoryFallback || { records: [] };
  }
}
function save(){
  memoryFallback = store;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }catch(e){
    if(e && e.name === "QuotaExceededError"){
      toast("保存容量がいっぱいです。写真を減らすか書き出してください");
    }
  }
}

/* ============ 画像圧縮 ============ */
function compressImage(file, maxSize=1000, quality=0.65){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ ユーティリティ ============ */
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
function result(r){ if(r.gf>r.ga) return "win"; if(r.gf<r.ga) return "loss"; return "draw"; }
function venueLabel(v){ return v==="away"?"アウェイ": v==="kokuritsu"?"国立":"味スタ"; }
function venueClass(v){ return v==="away"?"away": v==="kokuritsu"?"kokuritsu":"home"; }
function watchLabel(w){ return w==="tv"?"📺 テレビ":"🏟 現地"; }
function fmtDate(d){
  if(!d) return "";
  const s = normalizeDate(d);
  const dt = new Date(s+"T00:00:00");
  if(isNaN(dt)) return s;
  const w = ["日","月","火","水","木","金","土"][dt.getDay()];
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,"0")}.${String(dt.getDate()).padStart(2,"0")} (${w})`;
}
function seasonRecords(){
  return store.records
    .filter(r=>r.season===currentSeason)
    .sort((a,b)=> (b.date||"").localeCompare(a.date||""));
}
function toast(msg){

/* ============ 集計 ============ */
function computeStats(recs){
  let w=0,d=0,l=0,gf=0,ga=0,hw=0,hd=0,hl=0,aw=0,ad=0,al=0,starSum=0,starN=0;
  let liveN=0,liveW=0,tvN=0;
  const momCount = {};
  recs.forEach(r=>{
    const res = result(r);
    gf += r.gf; ga += r.ga;
    if(res==="win") w++; else if(res==="draw") d++; else l++;
    if(r.venue==="away"){ if(res==="win")aw++; else if(res==="draw")ad++; else al++; }
    else { if(res==="win")hw++; else if(res==="draw")hd++; else hl++; }
    if(r.watch==="tv"){ tvN++; } else { liveN++; if(res==="win") liveW++; }
    if(r.stars){ starSum += r.stars; starN++; }
    if(r.mom && r.mom.trim()){ const k=r.mom.trim(); momCount[k]=(momCount[k]||0)+1; }
  });
  const n = recs.length;
  const rate = n ? Math.round(w/n*100) : 0;
  const liveRate = liveN ? Math.round(liveW/liveN*100) : 0;
  const momRank = Object.entries(momCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return {n,w,d,l,gf,ga,hw,hd,hl,aw,ad,al,rate,liveN,liveW,tvN,liveRate,
    avgStar: starN? (starSum/starN) : 0,
    momRank};
}

  const today=new Date().toISOString().slice(0,10);
  const past=list.filter(m=>m.date<=today);
  return past.length?past[past.length-1]:list[0];
}

  return `${dt.getMonth()+1}/${dt.getDate()}(${w})`;

function importData(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.records || !Array.isArray(data.records)) throw 0;
      if(confirm("現在のデータに上書きします。よろしいですか？")){
        store = data; save(); renderAll(); toast("読み込みました");
      }
    }catch(err){ toast("ファイルを読み込めませんでした"); }
  };
  reader.readAsText(file);
}

function linesToText(arr){ return (arr||[]).join("\n"); }
function parseSubs(text){
  return parseLines(text).map(line=>{
    const m = line.match(/^(\d+)\s*分?\s*(.+?)\s*←\s*(.+)$/);
    if(!m) return null;
    return { minute: m[1], in: m[2].trim(), out: m[3].trim() };
  }).filter(Boolean);
}

function saveSquad(){
  const idx = store.records.findIndex(r=>r.id===squadEditingId);
  if(idx<0) return;
  const id = squadEditingId;
  store.records[idx].squad = {
    tokyo:{ st:parseLines($("#sqTokyoSt").value), bn:parseLines($("#sqTokyoBn").value) },
    opp:  { st:parseLines($("#sqOppSt").value),   bn:parseLines($("#sqOppBn").value) }
  };
  store.records[idx].subs = parseSubs($("#sqSubs").value);
  store.records[idx].referee = $("#sqRef").value.trim();
  save(); closeSquadModal(); renderAll(); toast("スカッドを保存しました");
  const hasTokyoSt = store.records[idx].squad.tokyo.st.length>0;
  if(hasTokyoSt) openRateModal(id);
}
function openSquadEntry(id){
  const r = store.records.find(x=>x.id===id); if(!r) return;
  const hasTokyoSt = r.squad && r.squad.tokyo && r.squad.tokyo.st && r.squad.tokyo.st.length;
  if(hasTokyoSt) openRateModal(id); else openSquadModal(id);
}

/* ============ 選手採点 ============ */
let ratingEditingId = null;
function openRateModal(id){
  const r = store.records.find(x=>x.id===id); if(!r) return;
  const sq = r.squad && r.squad.tokyo ? r.squad.tokyo : null;
  const players = sq ? [].concat(sq.st||[], sq.bn||[]) : [];
  if(!players.length){ toast("先に「スカッド」でFC東京のメンバーを登録してください"); return; }
  ratingEditingId = id;
  $("#rateTitle").textContent = `スカッド採点 vs ${r.opp||""}`;
  $("#rateFormation").innerHTML = Object.keys(FORM_LINES).map(f=>`<option value="${f}">${f}</option>`).join("");
  $("#rateFormation").value = r.formation||"4-4-2";
  const existing = {};
  (r.ratings||[]).forEach(x=>{ existing[x.name]=x; });
  $("#rateList").innerHTML = players.map(name=>{
    const e = existing[name]||{};
    const sc = (e.score!=null)?e.score:"";
    return `<div class="rate-row" data-name="${esc(name)}">
      <div class="rate-name">${esc(name)}</div>
      <input type="number" class="rate-score" step="0.5" min="3" max="10" placeholder="–" value="${sc}">
      <span class="rate-word">${scoreWord(sc!==""?parseFloat(sc):null)}</span>
      <input type="text" class="rate-note" placeholder="ひと言" value="${esc(e.note||"")}">
    </div>`;
  }).join("");
  $("#rateOverlay").classList.add("show");
  $$("#rateList .rate-score").forEach(inp=>{
    inp.oninput = ()=>{
      const v = inp.value.trim();
      inp.parentElement.querySelector(".rate-word").textContent = scoreWord(v!==""?parseFloat(v):null);
    };
  });
}
function closeRateModal(){ $("#rateOverlay").classList.remove("show"); ratingEditingId=null; }
function saveRating(){
  const idx = store.records.findIndex(r=>r.id===ratingEditingId);
  if(idx<0) return;
  const ratings=[];
  $$("#rateList .rate-row").forEach(row=>{
    const name=row.dataset.name;
    const scv=row.querySelector(".rate-score").value.trim();
    const note=row.querySelector(".rate-note").value.trim();
    if(scv!==""||note!==""){ ratings.push({name, score: scv!==""?parseFloat(scv):null, note}); }
  });
  store.records[idx].ratings=ratings;
  store.records[idx].formation=$("#rateFormation").value;
  save(); closeRateModal(); renderAll(); toast("採点を保存しました");
}
const FORM_LINES = {
  "4-4-2":[1,4,4,2], "4-2-3-1":[1,4,2,3,1], "4-3-3":[1,4,3,3],
  "3-4-2-1":[1,3,4,2,1], "3-4-3":[1,3,4,3], "4-1-4-1":[1,4,1,4,1],
  "4-4-1-1":[1,4,4,1,1], "3-5-2":[1,3,5,2], "5-3-2":[1,5,3,2], "5-4-1":[1,5,4,1]
};
/* 各ラインの選手ごとの縦位置microadjust（マイナス＝前線寄りに上げる）
   FORM_LINESと同じ並び。指定がなければ0（横一列）。 */
const FORM_OFFSETS = {
  "4-4-2":   [[0],[0,0,0,0],[-7,0,0,-7],[0,0]],
  "4-4-1-1": [[0],[0,0,0,0],[-7,0,0,-7],[0],[0]],
  "4-1-4-1": [[0],[0,0,0,0],[0],[-6,0,0,-6],[0]],
  "3-4-2-1": [[0],[0,0,0],[-7,0,0,-7],[0,0],[0]],
  "3-4-3":   [[0],[0,0,0],[-7,0,0,-7],[0,0,0]],
  "3-5-2":   [[0],[0,0,0],[-8,0,0,0,-8],[0,0]],
  "5-3-2":   [[0],[-8,0,0,0,-8],[0,0,0],[0,0]],
  "5-4-1":   [[0],[-8,0,0,0,-8],[-6,0,0,-6],[0]]
};
function shortName(n){ return String(n).replace(/^\s*\d+\s*/,""); }
function pitchScoreClass(s){ if(s==null) return "ps-none"; if(s>=7) return "ps-hi"; if(s>=6) return "ps-good"; if(s>=5) return "ps-mid"; return "ps-lo"; }
function scoreWord(s){
  if(s==null) return "";
  if(s>=9) return "伝説"; if(s>=8.5) return "無双"; if(s>=8) return "ヒーロー";
  if(s>=7.5) return "大活躍"; if(s>=7) return "活躍"; if(s>=6.5) return "及第点+";
  if(s>=6) return "及第点"; if(s>=5.5) return "及第点−"; if(s>=5) return "まずい";
  if(s>=4.5) return "だめ"; if(s>=4) return "敗因級"; return "事件";
}
function pitchHTML(r){
  const sq = r.squad && r.squad.tokyo ? r.squad.tokyo : null;
  if(!sq || !(sq.st && sq.st.length)) return "";
  const rmap={}; (r.ratings||[]).forEach(x=>rmap[x.name]=x);
  const form = r.formation || "4-4-2";
  const lines = FORM_LINES[form] || FORM_LINES["4-4-2"];
  const st = sq.st.slice(0,11);
  let idx2=0; const rows2=[];
  for(const cnt of lines){ rows2.push(st.slice(idx2, idx2+cnt)); idx2+=cnt; }
  const L=rows2.length;
  let players="";
  rows2.forEach((row,ri)=>{
    const baseY = L>1 ? 90 - ri*(80/(L-1)) : 50;
    const offRow = (FORM_OFFSETS[form] && FORM_OFFSETS[form][ri]) || [];
    row.forEach((name,ji)=>{
      const x = (ji+1)/(row.length+1)*100;
      const y = Math.max(4, Math.min(96, baseY + (offRow[ji] || 0)));
      const rt = rmap[name]||{}; const sc=rt.score;
      players += `<div class="player" style="left:${x}%;top:${y}%"><div class="pname">${esc(shortName(name))}</div><div class="pscore ${pitchScoreClass(sc)}">${sc!=null?sc.toFixed(1):"–"}</div>${sc!=null?`<div class="pword">${scoreWord(sc)}</div>`:""}</div>`;
    });
  });
  const bench = sq.bn||[];
  const subsByIn = {}; (r.subs||[]).forEach(s=>{ subsByIn[s.in]=s; });
  let subs="";
  if(bench.length){
    subs=`<div class="subs"><div class="subs-t">Substitute</div>`+bench.map(name=>{
      const rt=rmap[name]||{}; const sc=rt.score;
      const word = sc!=null?`<span class="sword">${scoreWord(sc)}</span>`:"";
      const info=rt.note?`<span class="sinfo">${esc(rt.note)}</span>`:"";
      const sub = subsByIn[name];
      const time = sub?`<div class="sub-time">${esc(sub.minute)}分 ← ${esc(sub.out)}</div>`:"";
      return `<div class="sub-row"><span class="sname">${esc(shortName(name))}</span><span class="sscore ${pitchScoreClass(sc)}">${sc!=null?sc.toFixed(1):"–"}</span>${word}${info}${time}</div>`;
    }).join("")+`</div>`;
  }
  const legend=`<div class="legend">
    <div><b>9.0</b>伝説</div><div><b>7.0</b>活躍</div><div><b>5.0</b>まずい</div>
    <div><b>8.5</b>無双</div><div><b>6.5</b>及第点+</div><div><b>4.5</b>だめ</div>
    <div><b>8.0</b>ヒーロー</div><div><b>6.0</b>及第点</div><div><b>4.0</b>敗因級</div>
    <div><b>7.5</b>大活躍</div><div><b>5.5</b>及第点−</div><div><b>3.5</b>事件</div>
  </div>`;
  return `<div class="pitch-wrap">
    <div class="pitch"><div class="line box-top"></div><div class="line box-bot"></div><div class="line centerline"></div><div class="line circle"></div>${players}</div>
    ${subs}${legend}
  </div>`;
}

/* ============ ロゴ設定 ============ */
const LOGO_KEY = "matchday_tokyo_logo";
function applyLogo(dataUrl){
  const img=$("#crestImg"), c=$("#crestBtn");
  if(dataUrl){ img.src=dataUrl; img.hidden=false; c.classList.add("has-logo"); }
  else { img.removeAttribute("src"); img.hidden=true; c.classList.remove("has-logo"); }
}
function loadLogo(){ try{ return localStorage.getItem(LOGO_KEY)||null; }catch(e){ return null; } }
async function setLogo(file){
  try{
    const data = await compressImage(file, 240, 0.9);
    try{ localStorage.setItem(LOGO_KEY, data); }catch(e){}
    applyLogo(data); toast("ロゴを設定しました");
  }catch(e){ toast("画像を読み込めませんでした"); }
}

/* ============ 対戦相手エンブレム ============ */
const CRESTS_KEY = "matchday_tokyo_crests";
function loadCrests(){ try{ const raw = localStorage.getItem(CRESTS_KEY); return raw?JSON.parse(raw):{}; }catch(e){ return {}; } }
function saveCrests(map){ try{ localStorage.setItem(CRESTS_KEY, JSON.stringify(map)); }catch(e){} }
function getCrest(teamName){ const m = loadCrests(); return m[teamName] || null; }
function crestImgTag(teamName){
  const src = getCrest(teamName);
  return src ? `<img class="team-crest" src="${src}" alt="">` : "";
}
function allKnownTeams(){
  const set = new Set();
  Object.values(SCHEDULE||{}).forEach(list=> list.forEach(m=>{ if(m.opp) set.add(m.opp); }));
  (store.records||[]).forEach(r=>{ if(r.opp) set.add(r.opp); });
  return Array.from(set).sort();
}
function renderCrestsModal(){
  const teams = allKnownTeams();
  const map = loadCrests();
  $("#crestsList").innerHTML = teams.length
    ? `<div class="crest-grid">${teams.map(t=>{
        const src = map[t];
        return `<button class="crest-tile" data-team="${esc(t)}">
          <span class="sq">${src?`<img src="${src}" alt="">`:`<span class="plus">＋</span>`}</span>
          <span class="nm">${esc(t)}</span>
        </button>`;
      }).join("")}</div>`
    : `<p style="font-size:.85rem;color:#6B7488">対戦相手がまだ登録されていません。日程を読み込むか試合を記録すると、ここに表示されます。</p>`;
  $$("#crestsList .crest-tile").forEach(b=>{
    b.onclick = ()=>{
      const input = document.createElement("input");
      input.type = "file"; input.accept = "image/*";
      input.onchange = async ()=>{
        if(!input.files[0]) return;
        try{
          const data = await compressImage(input.files[0], 200, 0.9);
          const m = loadCrests(); m[b.dataset.team] = data; saveCrests(m);
          renderCrestsModal(); renderAll(); toast(b.dataset.team+"のエンブレムを設定しました");
        }catch(e){ toast("画像を読み込めませんでした"); }
      };
      input.click();
    };
  });
}
function openCrestsModal(){ renderCrestsModal(); $("#crestsOverlay").classList.add("show"); }
function closeCrestsModal(){ $("#crestsOverlay").classList.remove("show"); }

/* ============ ライトボックス ============ */

$("#lightbox").onclick = ()=>$("#lightbox").classList.remove("show");

$("#cancelBtn").onclick = closeModal;

$("#overlay").onclick = e=>{ if(e.target===$("#overlay")) closeModal(); };

$$("#starpick span").forEach(s=>s.onclick=()=>setStars(+s.dataset.s));

$("#closeCrests").onclick = closeCrestsModal;
$("#closeCrests2").onclick = closeCrestsModal;

$("#closeSquad").onclick = closeSquadModal;
$("#cancelSquad").onclick = closeSquadModal;
$("#saveSquadBtn").onclick = saveSquad;
$("#squadOverlay").onclick = e=>{ if(e.target===$("#squadOverlay")) closeSquadModal(); };

$("#cancelRate").onclick = closeRateModal;

$("#rateOverlay").onclick = e=>{ if(e.target===$("#rateOverlay")) closeRateModal(); };
$("#editSquadFromRate").onclick = ()=>{ const id=ratingEditingId; closeRateModal(); if(id) openSquadModal(id); };
$("#crestBtn").onclick = ()=>$("#crestInput").click();
$("#crestInput").onchange = e=>{ if(e.target.files[0]) setLogo(e.target.files[0]); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModal(); closeSquadModal(); closeRateModal(); closeCrestsModal(); $("#lightbox").classList.remove("show"); }});

/* ============ 初期描画 ============ */
function renderAll(){ renderHero(); renderFeatured(); renderRecords(); if(!$("#view-stats").hidden) renderStats(); }
async function boot(){
  applyLogo(loadLogo());
  // まずキャッシュがあれば即座に表示（オフラインでも動くように）
  const cached = loadScheduleCache();
  if(cached){
    SCHEDULE = cached;
    SEASONS = Object.keys(SCHEDULE);
    currentSeason = SEASONS[0] || "";
    initSeasons();
    renderAll();
  }
  // 裏でGASから最新の日程を取得して差し替え
  await fetchSchedule();
  if(!currentSeason) currentSeason = SEASONS[0] || "";
  initSeasons();
  renderAll();
}
boot();
</script>
